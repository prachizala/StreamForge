name: StreamForge Multi-Engine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-gateway-ci:
    name: Go Gateway CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/gateway/go.sum

      - name: Verify Go Gateway
        run: |
          cd services/gateway
          go vet ./...
          go test -v ./...

  rust-engine-ci:
    name: Rust Media Kernel CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Check & Test
        run: |
          cd services/engine-rust
          cargo check --verbose
          cargo test --verbose

  nextjs-web-ci:
    name: Next.js Studio CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install & Build Studio
        run: |
          cd apps/web
          npm ci || npm install
          npm run build
